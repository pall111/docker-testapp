# MongoDB Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: testapp-ns
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
          # No auth set — matches server.js connection string: mongodb://mongo-service:27017
          # Add MONGO_INITDB_ROOT_USERNAME/PASSWORD here and update server.js URL if you want auth
---
# MongoDB Service (internal DNS name: mongo-service)
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: testapp-ns
spec:
  selector:
    app: mongo
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  type: ClusterIP
